name: 🐛 Bug
description: Something is broken.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: lang
    attributes:
      label: UI language
      options: [English, Français, العربية, Español]
