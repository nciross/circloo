# Local LiveKit call server (spec 009, research R30). Zero cost: a container on this machine.
# The AppHost fills the node IP and webhook URL placeholders below and passes this body as LIVEKIT_CONFIG (no file mounted).
# Keys come from LIVEKIT_KEYS ("circloo-dev: <secret>", the generated livekit-secret parameter), never from this file.
# No TURN, no egress, no ingress, no SIP: media is never recorded (SC-906, checked by CallServerConfigTests).
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  # One UDP port for all media (mux), so a single fixed port is published.
  udp_port: 7882
  # The address the browser is told to send media to. livekit-node-ip sets it to the LAN address for phone tests.
  node_ip: "${NODE_IP}"
  use_external_ip: false
room:
  # Only the API opens rooms, with its own limits (research R21).
  auto_create: false
  # The server can mute a microphone but never switch one on (FR-908).
  enable_remote_unmute: false
# Speaker detection (issue #276): LiveKit's v1.13.7 defaults, written out so the Azure VM config (T917) keeps them.
# Shorter windows were measured to drop the speaking highlight on ordinary 200-250 ms gaps between words (4 spoken
# sentences: 400 ms gave no drop outside a 700 ms pause, 300 ms gave 9 drops, 200 ms 17, 200 ms with 5 intervals still
# 16), so they are not shortened. A muted microphone ends the highlight on the client as soon as the mute arrives.
audio:
  update_interval: 400
  smooth_intervals: 2
webhook:
  api_key: circloo-dev
  urls:
    - "${WEBHOOK_URL}"
logging:
  level: info
